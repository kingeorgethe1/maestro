# Для публикации через командную строку (необязательно — можно через панель Cloudflare, см. README).
name = "maestro-api"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
ALLOWED_ORIGINS = "https://kingeorgethe1.github.io"
MODEL = "gpt-image-1.5"
QUALITY = "medium"
FREE_LIMIT = "3"
# номер кошелька ЮMoney для формы оплаты (секрет уведомлений — npx wrangler secret put YOOMONEY_SECRET)
YOOMONEY_WALLET = ""
LIMIT_TOTAL = "200"

# KV для дневных лимитов (создано: npx wrangler kv namespace create LIMITS)
[[kv_namespaces]]
binding = "LIMITS"
id = "193df30c92cc439ebde172d91dfd13e5"
