# Публикация на GitHub Pages: при каждом изменении в ветке main
# 1) докачиваются недостающие изображения картин с Wikimedia Commons и сохраняются в репозиторий;
# 2) сайт публикуется.
name: Deploy MAESTRO
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch painting images
        run: node scripts/fetch-images.mjs
        continue-on-error: true
      - name: Save fetched images to the repository
        run: |
          git config user.name "maestro-bot"
          git config user.email "maestro-bot@users.noreply.github.com"
          git add paintings
          git diff --cached --quiet || (git commit -m "Add painting images from Wikimedia Commons" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
